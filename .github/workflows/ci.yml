name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QUINT_CLI: ${{ github.workspace }}/test/reference-quint033/node_modules/@informalsystems/quint/dist/src/cli.js

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun ci

      - name: Install locked Quint 0.33 reference
        run: bun ci --cwd test/reference-quint033

      - name: Run tests
        run: bun run test

      - name: Verify generated parser is current
        run: bun run check:generated

      - name: Verify npm package
        run: bun run test:package

      - name: Audit Quint 0.33 boundary matrices
        id: audit
        env:
          QUINT_AUDIT_ARTIFACTS: ${{ runner.temp }}/quint-033-audit
        run: |
          bun run test:audit
          bun run test:audit:deep

      - name: Preserve failed audit sources and logs
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: quint-033-audit-failure
          path: ${{ runner.temp }}/quint-033-audit
          if-no-files-found: ignore
          retention-days: 7
