name: Exhaustive Quint 0.33 audit

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Quint 0.33 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boundary
            command: test:audit
          - name: deep
            command: test:audit:deep
    env:
      QUINT_CLI: ${{ github.workspace }}/test/reference-quint033/node_modules/@informalsystems/quint/dist/src/cli.js

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun ci

      - name: Install locked Quint 0.33 reference
        run: bun ci --cwd test/reference-quint033

      - name: Run exhaustive matrix
        id: audit
        env:
          QUINT_AUDIT_ARTIFACTS: ${{ runner.temp }}/quint-033-audit
        run: bun run ${{ matrix.command }}

      - name: Preserve failed audit sources and logs
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: quint-033-${{ matrix.name }}-failure
          path: ${{ runner.temp }}/quint-033-audit
          if-no-files-found: ignore
          retention-days: 7
